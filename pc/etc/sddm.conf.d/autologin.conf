# /etc/sddm.conf.d/autologin.conf
# After a Wake-on-LAN boot nobody is at the keyboard, so log straight into the desktop.
# The uwsm session runs Hyprland under systemd, which activates graphical-session.target;
# the Sunshine user service is bound to that target and starts automatically.
[Autologin]
User=your-username
Session=hyprland-uwsm
# Don't log back in automatically after a manual logout.
Relogin=false
