# /etc/nginx/sites-available/portfolio (symlinked into sites-enabled/)
# Static site behind the Cloudflare Tunnel. nginx only listens locally on :80; TLS is
# terminated at Cloudflare's edge.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/portfolio;
    index index.html;
    charset utf-8;
    access_log off;   # spare the SD card

    # Strict security headers: the site needs no third-party scripts, styles, fonts or frames.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Caching is handled at the Cloudflare edge (purged on every deploy), so the origin
    # tells browsers not to cache; fonts never change and can be cached for a month.
    location / { try_files $uri $uri/ =404; expires -1; }
    location /fonts/ { expires 30d; }
}
